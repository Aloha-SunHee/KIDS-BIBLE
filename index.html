<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>성경 이야기 퀴즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one centered "storybook card" column; start → question → result screens swap in place */
:root{
  --bg:#EAF4F8; --card:#FFFFFF; --ink:#1D2A36; --muted:#5A6B79; --line:#D3E2EA;
  --sea:#1C78B0; --sun:#FFC23A; --sunInk:#5A3B00; --leaf:#2E9E55; --berry:#D9434A;
  --tint1:#FFE7A8; --tint2:#CDE8F7; --tint3:#D7F0DC; --tint4:#FBD9D6;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A23; --card:#172834; --ink:#EAF2F7; --muted:#9DB2C1; --line:#284152;
  --sea:#62B8EA; --sun:#FFCF5A; --sunInk:#3A2700; --leaf:#4DC77A; --berry:#FF6E72;
  --tint1:#4A3B12; --tint2:#163B52; --tint3:#173F27; --tint4:#4A2224; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A23; --card:#172834; --ink:#EAF2F7; --muted:#9DB2C1; --line:#284152;
  --sea:#62B8EA; --sun:#FFCF5A; --sunInk:#3A2700; --leaf:#4DC77A; --berry:#FF6E72;
  --tint1:#4A3B12; --tint2:#163B52; --tint3:#173F27; --tint4:#4A2224; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sea);outline-offset:3px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px}
.btn{font-family:var(--display);font-size:20px;border:0;border-radius:16px;padding:12px 22px;background:var(--sun);color:var(--sunInk);box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.btn.ghost{background:transparent;color:var(--sea);box-shadow:none;border:2px solid var(--line)}
/* start */
.hero{display:grid;gap:14px}
.hero h1{font-size:clamp(34px,8vw,52px);color:var(--sea)}
.hero p{margin:0;color:var(--muted)}
.cover{position:relative;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.cover img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.label{font-family:var(--display);font-size:15px;letter-spacing:.04em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-family:var(--display);font-size:17px}
.chip[aria-pressed="true"]{background:var(--tint2);border-color:var(--sea);color:var(--ink)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px;text-align:left;display:grid;gap:2px}
.mode b{font-family:var(--display);font-weight:400;font-size:20px}
.mode span{color:var(--muted);font-size:15px}
.mode[aria-pressed="true"]{border-color:var(--sea);background:var(--tint2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prog{flex:1 1 160px;height:12px;border-radius:99px;background:var(--line);overflow:hidden;min-width:0}
.prog i{display:block;height:100%;background:var(--sea);width:0;transition:width .4s}
.count{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.score{font-family:var(--display);font-size:18px;background:var(--tint1);border-radius:99px;padding:4px 12px}
.teams{display:flex;gap:8px}
.team{font-family:var(--display);font-size:17px;border-radius:99px;padding:4px 12px;border:2px solid var(--line);font-variant-numeric:tabular-nums}
.team.on{border-color:var(--sun);background:var(--tint1)}
/* question */
.q{display:grid;gap:16px;padding:0;overflow:hidden}
.pic{position:relative;overflow:hidden;background:var(--line)}
.pic img{width:100%;aspect-ratio:20/9;object-fit:cover;display:block;transition:filter .7s,transform .7s}
.pic.mystery img{filter:blur(22px) saturate(1.3);transform:scale(1.15)}
.pic.mystery.revealed img{filter:none;transform:none}
.tag{position:absolute;left:12px;top:12px;font-family:var(--display);font-size:15px;background:var(--card);color:var(--ink);border-radius:99px;padding:3px 12px}
.tag.mys{left:auto;right:12px;background:var(--sun);color:var(--sunInk)}
.pic.revealed .tag.mys{display:none}
.qbody{padding:0 22px 22px;display:grid;gap:14px}
.turn{font-family:var(--display);font-size:16px;color:var(--sea)}
.qtext{font-size:clamp(24px,5.4vw,32px)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px;font-family:var(--display);font-size:21px;min-height:68px;transition:transform .1s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--sea)}
.opt .k{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;color:var(--ink)}
.opt:nth-child(1) .k{background:var(--tint1)}.opt:nth-child(2) .k{background:var(--tint2)}
.opt:nth-child(3) .k{background:var(--tint3)}.opt:nth-child(4) .k{background:var(--tint4)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 16%,var(--card))}
.opt.wrong{border-color:var(--berry);background:color-mix(in srgb,var(--berry) 14%,var(--card))}
.opt.dim{opacity:.5}
.opt .mark{margin-left:auto;font-size:24px}
.opt.right .mark{color:var(--leaf)} .opt.wrong .mark{color:var(--berry)}
.hint{color:var(--muted);font-size:16px;background:var(--bg);border-radius:12px;padding:10px 14px}
.fb{border-radius:16px;padding:14px 16px;display:grid;gap:4px;border:2px solid}
.fb.good{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 10%,var(--card))}
.fb.bad{border-color:var(--berry);background:color-mix(in srgb,var(--berry) 8%,var(--card))}
.fb h3{font-size:22px}
.fb.good h3{color:var(--leaf)} .fb.bad h3{color:var(--berry)}
.fb p{margin:0}
.ref{font-size:14px;color:var(--muted)}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
/* result */
.res{display:grid;gap:16px;text-align:center;justify-items:center}
.big{font-family:var(--display);font-size:clamp(56px,14vw,88px);color:var(--sea);line-height:1;font-variant-numeric:tabular-nums}
.stars{font-size:40px;letter-spacing:6px;color:var(--sun)}
.list{width:100%;display:grid;gap:8px;text-align:left}
.li{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.li img{width:72px;aspect-ratio:20/9;object-fit:cover;border-radius:8px;flex:none}
.li div{min-width:0;flex:1}
.li b{font-family:var(--display);font-weight:400;font-size:17px;display:block}
.li small{color:var(--muted)}
.li .ok{font-size:22px;flex:none}
.li .ok.y{color:var(--leaf)} .li .ok.n{color:var(--berry)}
.field{display:grid;gap:6px}
.field input{font:inherit;font-size:19px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;width:100%}
.field input:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.sync{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.sync.ok{color:var(--leaf)} .sync.err{color:var(--berry)}
.sync button{font-family:var(--display);font-size:16px;border:2px solid currentColor;background:transparent;border-radius:12px;padding:4px 12px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
/* music dock (YouTube player stays outside #app so it survives screen changes) */
.dock{max-width:760px;margin:16px auto 0;justify-content:space-between;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px}
.dock .info{flex:1 1 200px;min-width:0;display:grid;gap:8px}
.dock .now{font-family:var(--display);font-size:19px}
.dock .ctl{display:flex;gap:8px;flex-wrap:wrap}
.dock .ctl button{font-family:var(--display);font-size:16px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px}
.dock .ctl button[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.dock .note{font-size:14px;color:var(--muted)}
@media (max-width:520px){.opts,.modes{grid-template-columns:1fr}.opt{min-height:56px;font-size:19px}.cover{grid-template-columns:repeat(2,1fr)}.cover img:nth-child(n+5){display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main class="wrap" id="app"></main>
<aside class="dock" id="dock" hidden>
  <div class="info">
    <span class="label">배경음악</span>
    <span class="now" id="nowSong"></span>
    <span class="note" id="musicNote"></span>
  </div>
  <div class="ctl">
    <button id="bgmBtn" aria-pressed="true">🎵 배경음악</button>
    <button id="sfxBtn" aria-pressed="true">🔔 효과음</button>
  </div>
</aside>

  hint:"깜깜한 밤에도 환하게 빛났어요.", ex:"밤에는 불기둥이 길을 밝혀 주어서 백성은 밤낮으로 걸을 수 있었어요.", ref:"탈출 13,21"},
 {s:"mos", img:"q16", q:"모세가 바다 위로 손을 뻗자, 홍해는 어떻게 되었을까요?", o:["꽁꽁 얼어붙었어요","갈라져 마른 길이 생겼어요","모두 말라 사라졌어요","큰 파도가 덮쳤어요"], a:1,
  hint:"양쪽에 물이 벽처럼 서 있어요!", ex:"바닷물이 양쪽으로 갈라져 벽이 되고, 백성은 마른 땅을 밟고 바다를 건넜어요.", ref:"탈출 14,21-22"},
 {s:"mos", img:"q17", mystery:true, bonus:true, q:"보너스! 영상 속 바닷길 물 벽에서 헤엄치던 커다란 동물은?", o:["상어","문어","고래","거북"], a:2,
  hint:"바다에서 가장 큰 동물이에요.", ex:"애니메이션 속 물 벽에 커다란 고래가 헤엄치고 있었어요. 눈썰미 최고!", ref:"영상 속 숨은 그림"}
];

const $ = s => document.querySelector(s);
const app = $("#app");
/* ===== Google 시트 연동 =====
   퀴즈가 끝나면 결과 한 줄을 아래 Apps Script 웹 앱 주소로 보냅니다. */
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzdyIr3JkLKTClWCg4uVqDFgvlmIwVYtum6wcMdKSfoy1wBnSpRT8PbTc4YzGtz5Al1Ww/exec";
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
let st = {pick:new Set(STORIES.map(s=>s.id)), mode:"solo", who:store.get("quiz-who")||"", list:[], i:0, score:0, team:[0,0], answers:[], done:false, hintShown:false, record:null};
const TEAMS = ["비둘기팀","무지개팀"];
const esc = t => String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function start(){
  const covers = ["q2","q5","q8","q11","q13","q16"].map(k=>`<img src="${IMG[k]}" alt="">`).join("");
  app.innerHTML = `
  <section class="card hero">
    <div class="cover">${covers}</div>
    <div class="label">주일학교 · 구약 애니메이션 6편</div>
    <h1>성경 이야기 퀴즈</h1>
    <p>애니메이션 속 장면을 보고 정답을 골라 보세요. 흐릿한 그림은 정답을 맞히면 짠! 하고 선명해져요.</p>
  </section>
  <section class="card" style="display:grid;gap:12px">
    <div class="label">어떤 이야기를 풀까요?</div>
    <div class="chips">${STORIES.map(s=>`<button class="chip" data-s="${s.id}" aria-pressed="${st.pick.has(s.id)}">${s.name}</button>`).join("")}</div>
    <div class="label" style="margin-top:6px">어떻게 풀까요?</div>
    <div class="modes">
      <button class="mode" data-m="solo" aria-pressed="${st.mode==="solo"}"><b>다 함께 풀기</b><span>모두 같이 정답을 외쳐요</span></button>
      <button class="mode" data-m="team" aria-pressed="${st.mode==="team"}"><b>팀 대결</b><span>${TEAMS[0]}과 ${TEAMS[1]}이 번갈아 풀어요</span></button>
    </div>
    <label class="field" for="who" style="margin-top:6px">
      <span class="label">이름 (또는 반 이름)</span>
      <input id="who" maxlength="30" placeholder="예: 김요셉, 초등 3반" value="${esc(st.who)}" autocomplete="off">
    </label>
    <div class="row" style="justify-content:space-between;margin-top:6px">
      <span class="count" id="cnt"></span>
      <button class="btn" id="go">퀴즈 시작!</button>
    </div>
  </section>`;
  const upd = () => { const n = Q.filter(q=>st.pick.has(q.s)).length; $("#cnt").textContent = `문제 ${n}개`; $("#go").disabled = !n; };
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const id=b.dataset.s; st.pick.has(id)?st.pick.delete(id):st.pick.add(id); b.setAttribute("aria-pressed",st.pick.has(id)); sfx.pick(st.pick.has(id)); upd();});
  app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{st.mode=b.dataset.m; sfx.pick(true); app.querySelectorAll(".mode").forEach(x=>x.setAttribute("aria-pressed",x===b));});
  $("#go").onclick=()=>{
    const who=$("#who").value.trim();
    if(!who){ $("#who").focus(); $("#who").placeholder="이름을 먼저 적어 주세요!"; return; }
    st.who=who; store.set("quiz-who",who);
    st.list=Q.filter(q=>st.pick.has(q.s)); st.i=0; st.score=0; st.team=[0,0]; st.answers=[]; st.record=null;
    sfx.start(); music.play(st.list[0].s); show();};
  music.stop();
  upd();
}

function bar(){
  const n=st.list.length, pct=Math.round(st.i/n*100);
  const right = st.mode==="team"
    ? `<div class="teams">${TEAMS.map((t,k)=>`<span class="team ${k===st.i%2?"on":""}">${t} ${st.team[k]}</span>`).join("")}</div>`
    : `<span class="score">★ ${st.score}</span>`;
  return `<div class="bar"><span class="count">${st.i+1} / ${n}</span><div class="prog"><i style="width:${pct}%"></i></div>${right}</div>`;
}

function show(){
  const q=st.list[st.i]; st.done=false; st.hintShown=false;
  const story=STORIES.find(s=>s.id===q.s).name;
  app.innerHTML = `${bar()}
  <section class="card q">
    <div class="pic ${q.mystery?"mystery":""}" id="pic">
      <img src="${IMG[q.img]}" alt="${esc(story)} 애니메이션 장면">
      <span class="tag">${esc(story)}</span>
      ${q.mystery?'<span class="tag mys">흐릿한 그림 퀴즈</span>':""}
    </div>
    <div class="qbody">
      ${st.mode==="team"?`<div class="turn">${TEAMS[st.i%2]} 차례예요!</div>`:""}
      <h2 class="qtext">${esc(q.q)}</h2>
      <div class="opts">${q.o.map((t,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span><span>${esc(t)}</span><span class="mark"></span></button>`).join("")}</div>
      <div id="extra"></div>
      <div class="actions" id="act"><button class="btn ghost" id="hintBtn">힌트 보기</button></div>
    </div>
  </section>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  music.play(q.s);
  $("#hintBtn").onclick=hint;
  window.scrollTo({top:0,behavior:"smooth"});
}

function hint(){
  if(st.done||st.hintShown) return; st.hintShown=true;
  $("#extra").innerHTML=`<div class="hint">💡 ${esc(st.list[st.i].hint)}</div>`;
  $("#hintBtn").remove();
}

function answer(k){
  if(st.done) return; st.done=true;
  const q=st.list[st.i], ok=k===q.a;
  if(ok){ if(st.mode==="team") st.team[st.i%2]++; else st.score++; burst(); sfx.right(); }
  else sfx.wrong();
  st.answers.push({q,ok,pick:k,team:st.mode==="team"?TEAMS[st.i%2]:""});
  app.querySelectorAll(".opt").forEach(b=>{const j=+b.dataset.k; b.disabled=true;
    if(j===q.a){b.classList.add("right");b.querySelector(".mark").textContent="✓";}
    else if(j===k){b.classList.add("wrong");b.querySelector(".mark").textContent="✗";}
    else b.classList.add("dim");});
  $("#pic").classList.add("revealed");
  const cheers=["딩동댕! 정답이에요","우와, 맞혔어요!","최고예요, 정답!","대단해요, 딩동댕!"];
  const tries=["아쉬워요!","앗, 다시 생각해 봐요","괜찮아요, 정답은 바로…"];
  const who = st.mode==="team" ? `${TEAMS[st.i%2]} ` : "";
  $("#extra").innerHTML=`<div class="fb ${ok?"good":"bad"}" role="status">
    <h3>${who}${ok?cheers[st.i%cheers.length]:tries[st.i%tries.length]}</h3>
    <p>${ok?"":`정답은 <b>${esc(q.o[q.a])}</b>! `}${esc(q.ex)}</p>
    <span class="ref">${esc(q.ref)}</span></div>`;
  const last=st.i===st.list.length-1;
  $("#act").innerHTML=`<button class="btn" id="next">${last?"결과 보기":"다음 문제 →"}</button>`;
  $("#next").onclick=()=>{ if(last) result(); else {st.i++; show();} };
  $("#next").focus({preventScroll:true});
  // update scoreboard in bar
  const b=app.querySelector(".bar"); if(b) b.outerHTML=bar().replace(`${Math.round(st.i/st.list.length*100)}%`,`${Math.round((st.i+1)/st.list.length*100)}%`);
}

function result(){
  const n=st.list.length;
  let head;
  if(st.mode==="team"){
    const [a,b]=st.team; const w=a===b?"무승부! 두 팀 모두 최고예요":`${a>b?TEAMS[0]:TEAMS[1]} 승리!`;
    head=`<div class="big">${a} : ${b}</div><h2 style="font-size:28px">${w}</h2><div class="label">${TEAMS[0]} vs ${TEAMS[1]}</div>`;
  } else {
    const r=st.score/n, stars=r>=.9?3:r>=.6?2:r>0?1:0;
    const msg=["다시 한번 영상을 보고 도전해요!","잘했어요! 조금만 더!","멋져요! 성경 박사가 되어 가요","완벽해요! 성경 이야기 박사!"][stars];
    head=`<div class="stars" aria-label="별 ${stars}개">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div><div class="big">${st.score} / ${n}</div><h2 style="font-size:28px">${msg}</h2>`;
  }
  app.innerHTML=`<section class="card res">${head}
    <div class="list">${st.answers.map(x=>`<div class="li"><img src="${IMG[x.q.img]}" alt=""><div><b>${esc(x.q.o[x.q.a])}</b><small>${esc(x.q.q)}</small></div><span class="ok ${x.ok?"y":"n"}">${x.ok?"○":"✗"}</span></div>`).join("")}</div>
    <div class="sync" id="sync" role="status"></div>
    <div class="row"><button class="btn" id="again">처음으로</button></div></section>`;
  $("#again").onclick=start;
  st.record=buildRecord();
  sendRecord();
  if(st.mode==="team"||st.score/n>=.6) burst(140);
  music.stop(); sfx.fanfare();
  window.scrollTo({top:0,behavior:"smooth"});
}

function buildRecord(){
  const n=st.list.length;
  const stories=STORIES.filter(s=>st.pick.has(s.id)).map(s=>s.name);
  return {
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    clientTime: new Date().toLocaleString("ko-KR",{timeZone:"Asia/Seoul"}),
    name: st.who,
    mode: st.mode==="team"?"팀 대결":"다 함께 풀기",
    stories: stories.length===STORIES.length?"전체":stories.join(", "),
    total: n,
    score: st.mode==="team"?"":st.score,
    teamA: st.mode==="team"?st.team[0]:"",
    teamB: st.mode==="team"?st.team[1]:"",
    wrong: st.answers.filter(x=>!x.ok).map(x=>Q.indexOf(x.q)+1).join(", "),
    detail: st.answers.map(x=>`${Q.indexOf(x.q)+1}번 ${x.ok?"○":"✗"} ${x.q.o[x.pick]}${x.team?` (${x.team})`:""}`).join(" / ")
  };
}

async function sendRecord(){
  const box=$("#sync"); if(!box||!st.record) return;
  box.className="sync"; box.textContent="Google 시트에 기록하는 중…";
  try{
    // Apps Script는 CORS 응답을 주지 않으므로 no-cors + text/plain 으로 보냅니다.
    await fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(st.record)});
    box.className="sync ok"; box.textContent=`✓ ${st.record.name}님의 기록을 시트에 보냈어요`;
  }catch(e){
    box.className="sync err";
    box.innerHTML=`기록을 보내지 못했어요. 인터넷 연결을 확인해 주세요. <button id="resend">다시 보내기</button>`;
    $("#resend").onclick=sendRecord;
  }
}

document.addEventListener("keydown",e=>{
  if(!app.querySelector(".opt")) return;
  if(!st.done && /^[1-4]$/.test(e.key)) answer(+e.key-1);
  else if(!st.done && (e.key==="h"||e.key==="H")) hint();
});

/* confetti */
const cv=$("#fx"), cx=cv.getContext("2d"); let parts=[], raf=0;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(n=70){
  if(reduce) return;
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=["#FFC23A","#1C78B0","#2E9E55","#D9434A","#62B8EA","#FF8FB1"];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:Math.random()*7+5,c:cols[i%cols.length],r:Math.random()*6,life:90+Math.random()*40});
  if(!raf) tick();
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.15;p.life--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<cv.height+20);
  raf=parts.length?requestAnimationFrame(tick):0;
  if(!raf) cx.clearRect(0,0,cv.width,cv.height);
}
/* ===== 효과음 (Web Audio로 직접 만든 소리, 파일 필요 없음) ===== */
const sfx = (() => {
  let ctx = null, on = true;
  const ac = () => { if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
                     if(ctx.state==="suspended") ctx.resume(); return ctx; };
  // 한 음 연주: 주파수, 시작(초), 길이, 파형, 크기, 끝 주파수(미끄러짐)
  function tone(f, t0, dur, type="triangle", vol=.25, f2){
    const c=ac(); if(!c||!on) return;
    const t=c.currentTime+t0, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
  }
  const N={C5:523.25,D5:587.33,E5:659.25,G5:783.99,A5:880,C6:1046.5,E6:1318.5,G6:1568,C7:2093};
  return {
    get on(){ return on; }, set on(v){ on=v; },
    unlock: ac,
    // 이야기 고르기: 뽁! (켤 때는 올라가고,끌 때는 내려가요)
    pick(sel){ sel ? (tone(N.G5,0,.09,"square",.12), tone(N.C6,.07,.14,"square",.12))
                   : (tone(N.E5,0,.09,"square",.1), tone(N.C5,.07,.14,"square",.1)); },
    // 퀴즈 시작: 도-미-솔-도 팡!
    start(){ [N.C5,N.E5,N.G5,N.C6].forEach((f,i)=>tone(f,i*.08,.18,"square",.13)); tone(N.C6,.32,.4,"triangle",.2); },
    // 정답: 딩동댕~ 반짝
    right(){ tone(N.C6,0,.25,"sine",.3); tone(N.E6,.12,.25,"sine",.3); tone(N.G6,.24,.5,"sine",.32);
             tone(N.C7,.24,.6,"triangle",.08); },
    // 오답: 뿌우~ 뿌우~ (아쉬운 소리)
    wrong(){ tone(392,0,.28,"sawtooth",.12,370); tone(330,.3,.55,"sawtooth",.12,262); },
    // 결과 발표: 빠밤빠밤~
    fanfare(){ [[N.G5,0,.15],[N.G5,.16,.15],[N.G5,.32,.15],[N.C6,.5,.6]].forEach(([f,t,d])=>{tone(f,t,d,"square",.12); tone(f/2,t,d,"triangle",.12);}); }
  };
})();

/* ===== 배경음악 (index.html 옆 music 폴더의 mp3 파일) =====
   노래를 바꾸려면 music 폴더에 mp3를 넣고 아래 src 의 파일 이름만 바꾸면 돼요. */
const SONGS = {
  a:{src:"music/all-the-ends.mp3",  title:"All The Ends Of The Earth", stories:["adam","noah","mos"]},
  b:{src:"music/seek-ye-first.mp3", title:"Seek Ye First",             stories:["abr","jos"]},
  c:{src:"music/korean-song.mp3",   title:"",                          stories:["jac"]}
};
const music = (() => {
  const audio = new Audio(); audio.loop = true; audio.preload = "auto"; audio.volume = .35;
  let cur=null, on=true, playing=false;
  const dock=$("#dock"), note=$("#musicNote"), now=$("#nowSong");
  const songFor = s => Object.values(SONGS).find(x=>x.stories.includes(s));
  const names = s => s.stories.map(id=>STORIES.find(x=>x.id===id).name).join(" · ");
  function go(){
    if(!on||!playing) return;
    audio.play().then(()=>{ note.textContent=""; })
      .catch(()=>{ note.textContent="음악이 안 나오면 🎵 배경음악 버튼을 두 번 눌러 주세요."; });
  }
  audio.addEventListener("error",()=>{ if(audio.getAttribute("src")) note.textContent="노래 파일을 찾지 못했어요. music 폴더가 index.html과 같은 곳에 올라가 있는지 확인해 주세요."; });
  $("#bgmBtn").onclick=e=>{ on=!on; e.currentTarget.setAttribute("aria-pressed",on); on ? go() : audio.pause(); };
  $("#sfxBtn").onclick=e=>{ sfx.on=!sfx.on; e.currentTarget.setAttribute("aria-pressed",sfx.on); if(sfx.on) sfx.pick(true); };
  return {
    play(story){
      const s=songFor(story); if(!s) return; playing=true; dock.hidden=false;
      if(cur!==s){ cur=s; audio.src=s.src; now.textContent="🎵 "+(s.title||names(s)); }
      if(audio.paused) go();
    },
    stop(){ playing=false; dock.hidden=true; audio.pause(); }
  };
})();

start();
</script>
