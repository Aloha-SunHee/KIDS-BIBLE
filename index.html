<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KIDS BIBLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one column — wordmark, the big quiz door, then a grid of lesson "doors" found automatically */
:root{
  --bg:#EAF4F8; --card:#FFFFFF; --ink:#1D2A36; --muted:#5A6B79; --line:#D3E2EA;
  --sea:#1C78B0; --sun:#FFC23A; --sunInk:#5A3B00; --sand:#F6ECD9; --saffron:#E8A317;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A23; --card:#172834; --ink:#EAF2F7; --muted:#9DB2C1; --line:#284152;
  --sea:#62B8EA; --sun:#FFCF5A; --sunInk:#3A2700; --sand:#3A2E1C; --saffron:#F0B63A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A23; --card:#172834; --ink:#EAF2F7; --muted:#9DB2C1; --line:#284152;
  --sea:#62B8EA; --sun:#FFCF5A; --sunInk:#3A2700; --sand:#3A2E1C; --saffron:#F0B63A; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;word-break:keep-all;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
img{max-width:100%}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid var(--sea);outline-offset:4px;border-radius:22px}
.top{display:grid;gap:4px}
.top h1{font-size:clamp(40px,9vw,64px);color:var(--sea);letter-spacing:.02em}
.top p{margin:0;color:var(--muted);font-size:18px}
.door{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--card);border:2px solid var(--line);border-radius:24px;overflow:hidden;transition:transform .15s,border-color .15s}
.door:hover{transform:translateY(-3px);border-color:var(--sea)}
.thumbs{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;background:var(--line);min-height:220px}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs img:first-child{grid-row:span 2}
.door .txt{padding:24px;display:grid;gap:10px;align-content:center}
.eyebrow{font-family:var(--display);font-size:15px;letter-spacing:.06em;color:var(--muted)}
.door h2{font-size:clamp(30px,6vw,40px)}
.door p{margin:0;color:var(--muted)}
.go{justify-self:start;font-family:var(--display);font-size:20px;border-radius:16px;padding:10px 20px;background:var(--sun);color:var(--sunInk);box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec h2{font-size:28px}
.sec span{color:var(--muted);font-size:15px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.lesson{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;transition:transform .15s,border-color .15s}
.lesson:hover{transform:translateY(-3px);border-color:var(--saffron)}
.num{width:64px;height:64px;border-radius:18px;background:var(--sand);display:grid;place-items:center;font-family:var(--display);color:var(--ink);line-height:1;text-align:center}
.num b{font-weight:400;font-size:28px;display:block;font-variant-numeric:tabular-nums}
.num small{font-size:13px}
.lesson h3{font-size:21px}
.lesson p{margin:2px 0 0;color:var(--muted);font-size:15px}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:18px;color:var(--muted)}
.empty code{font-size:15px;background:var(--bg);padding:1px 6px;border-radius:6px}
@media (max-width:620px){.door{grid-template-columns:1fr}.thumbs{min-height:170px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <div class="sec">
    <h2>과별 수업</h2>
    <span id="lessonCount">수업을 찾는 중…</span>
  </div>
  <div class="lessons" id="lessons"></div>
</div>

<script>
/* 과별 수업은 저장소에 올린 lesson-숫자.html 파일을 자동으로 찾아 보여 줍니다.
   새 수업은 lesson-15.html 처럼 이름만 맞춰 올리면 목록에 나타나요. */
const MAX_LESSON = 60;
const box = document.getElementById("lessons"), count = document.getElementById("lessonCount");
const esc = t => String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 파일 앞부분만 읽어서 제목과 부제를 꺼냅니다 (그림이 많아 파일이 커도 빠르게)
async function peek(n){
  let res;
  try{ res = await fetch(`lesson-${n}.html`, {cache:"no-cache"}); }catch(e){ return null; }
  if(!res.ok) return null;
  let text = "";
  try{
    const reader = res.body.getReader(), dec = new TextDecoder();
    while(text.length < 60000){
      const {done, value} = await reader.read(); if(done) break;
      text += dec.decode(value, {stream:true});
      if(/<\/title>/i.test(text) && /class="brand"[\s\S]*?<\/small>/.test(text)) break;
    }
    reader.cancel().catch(()=>{});
  }catch(e){ text = text || ""; }
  const title = (text.match(/<title>([^<]*)<\/title>/i)||[])[1] || `${n}과 수업`;
  const sub = (text.match(/class="brand"[\s\S]*?<small>([^<]*)<\/small>/)||[])[1] || "";
  return {n, title: title.replace(/\s*수업\s*$/,"").trim(), sub: sub.replace(new RegExp(`^\\s*${n}과\\s*[·.\\-]?\\s*`),"").trim()};
}

(async () => {
  const found = (await Promise.all(Array.from({length:MAX_LESSON},(_,i)=>peek(i+1)))).filter(Boolean);
  if(!found.length){
    count.textContent = "";
    box.innerHTML = `<div class="empty">아직 올라간 수업이 없어요. 수업 파일을 <code>lesson-14.html</code>처럼 이름을 붙여 올리면 여기에 나타나요.</div>`;
    return;
  }
  count.textContent = `${found.length}개 수업`;
  box.innerHTML = found.map(l=>`
    <a class="lesson" href="lesson-${l.n}.html">
      <span class="num"><b>${l.n}</b><small>과</small></span>
      <div><h3>${esc(l.title)}</h3>${l.sub?`<p>${esc(l.sub)}</p>`:""}</div>
    </a>`).join("");
})();
</script>
