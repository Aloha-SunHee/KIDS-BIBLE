<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>꿈꾸는 요셉 수업</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: classroom projector page — tab bar on top, one big 16:9 stage per activity. Single warm light theme by choice. */
:root{
  --sand:#f6ecd9; --sand-2:#efe0c2; --paper:#fffaf0;
  --ink:#3a2a1a; --ink-soft:#6f5a43;
  --lapis:#1f4e8c; --saffron:#e8a317; --rose:#c8553d; --leaf:#4f8a3c;
  --line:#e2cfa9;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body,h2,h3,p,.cap,.opt{word-break:keep-all;overflow-wrap:break-word}
html,body{height:100%}
body{background:var(--sand);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sand)}
.wrap{max-width:1180px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sand);display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px 12px;border-bottom:2px dashed var(--line)}
.brand{font-family:var(--display);font-size:24px;color:var(--lapis);display:flex;align-items:center;gap:10px;margin-right:auto}
.brand small{font-family:var(--body);font-size:14px;color:var(--ink-soft)}
.star{width:26px;height:26px;flex:none}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button,.btn{font-family:var(--display);font-size:18px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 18px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--lapis);border-color:var(--lapis);color:#fff}
a.btn{text-decoration:none;display:inline-block}
.btn.primary{background:var(--saffron);border-color:var(--ink)}
.btn.ghost{background:transparent}
button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.btn:disabled{opacity:.35;cursor:default}
main{padding-top:18px}
section[hidden]{display:none!important}
h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;color:var(--ink);text-wrap:balance}
.lead{margin:2px 0 14px;color:var(--ink-soft)}

/* ---------- slides ---------- */
.stage{background:var(--paper);border:3px solid var(--ink);border-radius:22px;overflow:hidden;aspect-ratio:16/9;max-width:100%;position:relative}
:fullscreen .stage{border:0;border-radius:0;aspect-ratio:auto;height:calc(100vh - 80px)}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:4%;padding:4% 5%}
.slide[hidden]{display:none}
.slide figure{margin:0;height:100%;display:flex;align-items:center;justify-content:center;min-width:0}
.slide figure img{max-height:100%;max-width:100%;width:auto;height:auto;border-radius:14px;border:3px solid var(--ink);background:#fff}
.slide .txt{min-width:0}
.chip{display:inline-block;font-family:var(--display);font-size:clamp(13px,1.6vw,20px);background:var(--saffron);border:2px solid var(--ink);border-radius:999px;padding:2px 14px;margin-bottom:.6em}
.slide h3{font-family:var(--display);font-weight:400;font-size:clamp(22px,3.6vw,46px);line-height:1.25;margin:0 0 .45em;color:var(--lapis);text-wrap:balance}
.slide p{font-size:clamp(14px,2vw,25px);margin:0;line-height:1.6}
.slide .ref{margin-top:1em;font-size:clamp(11px,1.3vw,16px);color:var(--ink-soft)}
.slide.cover,.slide.msg{grid-template-columns:1fr;text-align:center;justify-items:center;background:var(--lapis);color:#fff}
.slide.cover h3,.slide.msg h3{color:#fff;font-size:clamp(28px,5.2vw,68px)}
.slide.cover p,.slide.msg p{color:#f3e6c8}
.slide.cover .chip,.slide.msg .chip{color:var(--ink)}
.sheaves{display:flex;gap:2%;justify-content:center;margin-top:1.2em;width:60%}
.sheaves svg{width:14%;height:auto}
.amen{display:inline-block;margin-top:1.1em;font-family:var(--display);font-size:clamp(16px,2.4vw,30px);background:var(--paper);color:var(--ink);border-radius:999px;padding:.25em 1.1em}
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:14px;height:14px;padding:0;border-radius:50%;border:2px solid var(--ink);background:var(--paper);cursor:pointer}
.dots button[aria-current="true"]{background:var(--rose)}
.count{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--ink-soft)}

/* ---------- ordering activity ---------- */
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.slot{min-height:150px;border:3px dashed var(--ink-soft);border-radius:16px;background:var(--sand-2);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:6px;cursor:pointer;font:inherit;color:inherit}
.slot .num{position:absolute;top:-14px;left:50%;translate:-50% 0;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--display);font-size:19px;display:grid;place-items:center;z-index:2}
.slot.filled{border-style:solid;border-color:var(--ink);background:#fff}
.slot img{width:100%;aspect-ratio:1.15;object-fit:cover;border-radius:10px}
.slot .cap{font-size:13px;line-height:1.35;margin-top:4px;text-align:center}
.slot .empty{color:var(--ink-soft);font-size:14px;text-align:center}
.slot.ok{border-color:var(--leaf);box-shadow:0 0 0 4px var(--leaf)}
.slot.no{border-color:var(--rose);box-shadow:0 0 0 4px var(--rose)}
.mark{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#fff;z-index:2}
.slot.ok .mark{background:var(--leaf)} .slot.no .mark{background:var(--rose)}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 8px 10px;cursor:pointer;text-align:center;font:inherit;color:inherit;transition:transform .15s}
.card:hover{transform:translateY(-3px) rotate(-.6deg)}
.card.used{visibility:hidden}
.card img{width:100%;aspect-ratio:1.15;object-fit:cover;border-radius:10px;display:block}
.card .bracket{font-family:var(--display);color:var(--ink-soft);letter-spacing:.3em;margin:4px 0 0}
.card .cap{font-weight:700;font-size:16px;line-height:1.4;margin:2px 4px 0}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.result{font-family:var(--display);font-size:22px;color:var(--lapis);min-height:1.5em}
.hint{font-size:15px;color:var(--ink-soft)}

/* ---------- quiz ---------- */
.quiz{background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:clamp(18px,3vw,36px)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qnum{font-family:var(--display);font-size:20px;background:var(--saffron);border:2px solid var(--ink);border-radius:999px;padding:2px 14px}
.qtime{font-size:14px;color:var(--ink-soft)}
.qtext{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,40px);line-height:1.3;margin:6px 0 18px;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{font-family:var(--body);font-weight:700;font-size:clamp(17px,2.2vw,24px);text-align:left;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:14px 18px;cursor:pointer;display:flex;gap:12px;align-items:center;color:var(--ink)}
.opt .k{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);background:var(--sand-2);border:2px solid var(--ink)}
.opt.right{background:#e3f1db;border-color:var(--leaf)} .opt.right .k{background:var(--leaf);color:#fff}
.opt.wrong{background:#f8dcd5;border-color:var(--rose)} .opt.wrong .k{background:var(--rose);color:#fff}
.opt:disabled{cursor:default}
.explain{margin-top:16px;font-size:clamp(16px,2vw,21px);background:var(--sand-2);border-radius:14px;padding:12px 16px;border-left:6px solid var(--lapis)}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.score{text-align:center;padding:20px 0}
.score .big{font-family:var(--display);font-size:clamp(40px,7vw,80px);color:var(--lapis);line-height:1.1}
.teacher{margin-top:16px;font-size:15px;color:var(--ink-soft)}
.teacher summary{cursor:pointer;font-weight:700}
.teacher ol{margin:.5em 0 0;padding-left:1.4em}

@media (max-width:760px){
  .slide{grid-template-columns:1fr;grid-template-rows:55% auto;padding:4%;gap:3%}
  .slots{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:22px}
  .opts{grid-template-columns:1fr}
  .stage{aspect-ratio:3/4}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>

<div class="wrap">
<header>
  <a class="btn ghost home" href="./">← 처음 화면</a>
  <div class="brand">
    <svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z" fill="var(--saffron)" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/></svg>
    꿈꾸는 요셉 <small>14과 · 창세기 37–45장</small>
  </div>
  <nav role="tablist">
    <button role="tab" id="tab-story" aria-selected="true" data-view="story">① 이야기</button>
    <button role="tab" id="tab-order" aria-selected="false" data-view="order">② 순서 맞추기</button>
    <button role="tab" id="tab-quiz" aria-selected="false" data-view="quiz">③ 동영상 퀴즈</button>
  </nav>
  <button class="btn ghost" id="fs" type="button">전체 화면</button>
</header>

<main>
<!-- ================= STORY ================= -->
<section id="v-story">
  <div class="stage" id="stage"></div>
  <div class="controls">
    <button class="btn" id="prev" type="button">◀ 이전</button>
    <div class="dots" id="dots"></div>
    <span class="count" id="count"></span>
    <button class="btn primary" id="next" type="button">다음 ▶</button>
  </div>
  <p class="hint">키보드 ← → 또는 스페이스바로 넘길 수 있어요.</p>
</section>

<!-- ================= ORDER ================= -->
<section id="v-order" hidden>
  <h2>알아가기</h2>
  <p class="lead">요셉의 이야기예요. <b>요셉</b>의 이야기를 순서대로 만들어보세요.</p>
  <div class="slots" id="slots"></div>
  <div class="bar">
    <button class="btn primary" id="check" type="button">정답 확인</button>
    <button class="btn" id="reset" type="button">처음부터 다시</button>
    <span class="result" id="result" aria-live="polite"></span>
  </div>
  <p class="hint">그림을 누르면 빈칸에 차례로 들어가요. 칸에 들어간 그림을 다시 누르면 빠져나와요.</p>
  <div class="pool" id="pool"></div>
</section>

<!-- ================= QUIZ ================= -->
<section id="v-quiz" hidden>
  <div class="quiz" id="quiz"></div>
  <details class="teacher">
    <summary>교사용 정답 보기</summary>
    <ol id="answers"></ol>
  </details>
</section>
</main>
</div>

/* ---------- views ---------- */
const views = ["story","order","quiz"];
function show(v){
  views.forEach(x=>{
    document.getElementById("v-"+x).hidden = x!==v;
    document.getElementById("tab-"+x).setAttribute("aria-selected", x===v);
  });
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.view));
const h = location.hash.slice(1); if(views.includes(h)) show(h);

document.getElementById("fs").onclick=()=>{
  const el=document.documentElement;
  if(document.fullscreenElement){document.exitFullscreen?.().catch(()=>{});}
  else{el.requestFullscreen?.().catch(()=>{});}
};

const stage=document.getElementById("stage"), dots=document.getElementById("dots");
slides.forEach((s,i)=>{
  const d=document.createElement("div"); d.className="slide "+(s.cls||""); d.hidden=i>0;
  d.innerHTML = s.img
    ? `<figure><img src="${IMG[s.img]}" alt=""></figure><div class="txt"><span class="chip">${s.chip}</span><h3>${s.h}</h3><p>${s.p}</p>${s.ref?`<p class="ref">${s.ref}</p>`:""}</div>`
    : `<div class="txt"><span class="chip">${s.chip}</span><h3>${s.h}</h3><p>${s.p}</p>${s.extra||""}</div>`;
  stage.appendChild(d);
  const b=document.createElement("button"); b.type="button"; b.setAttribute("aria-label",(i+1)+"번 슬라이드"); b.onclick=()=>go(i); dots.appendChild(b);
});
let cur=0;
function go(i){
  cur=Math.max(0,Math.min(slides.length-1,i));
  [...stage.children].forEach((el,k)=>el.hidden=k!==cur);
  [...dots.children].forEach((el,k)=>el.setAttribute("aria-current",k===cur));
  document.getElementById("count").textContent=(cur+1)+" / "+slides.length;
  document.getElementById("prev").disabled=cur===0;
  document.getElementById("next").disabled=cur===slides.length-1;
}
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
stage.onclick=e=>{ if(e.target.closest("button"))return; go(cur+1); };
document.addEventListener("keydown",e=>{
  if(document.getElementById("v-story").hidden) return;
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();go(cur+1);}
  if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(cur-1);}
});
go(0);

/* ---------- ordering ---------- */
// Cards in the workbook's own layout order; answer key is the story order.
const cards = [
  {id:"pit",  cap:"형들은 요셉을 구덩이에 빠뜨렸어요.", n:2},
  {id:"gov",  cap:"요셉은 이집트의 재상이 되었어요.", n:5},
  {id:"hate", cap:"형들은 아버지의 사랑을 받는 요셉을 미워했어요.", n:1},
  {id:"sold", cap:"요셉은 상인들에게 팔려갔어요.", n:3},
  {id:"pharaoh", cap:"요셉은 이집트 왕의 꿈을 풀이해 주었어요.", n:4}
];
const placed=[null,null,null,null,null];
const slotsEl=document.getElementById("slots"), poolEl=document.getElementById("pool"), resEl=document.getElementById("result");
function renderOrder(checked){
  slotsEl.innerHTML="";
  placed.forEach((cid,i)=>{
    const c=cards.find(x=>x.id===cid);
    const b=document.createElement("button"); b.type="button"; b.className="slot"+(c?" filled":"");
    let state="";
    if(checked&&c){ state = c.n===i+1 ? "ok":"no"; b.classList.add(state); }
    b.innerHTML=`<span class="num">${i+1}</span>`+(state?`<span class="mark">${state==="ok"?"○":"✕"}</span>`:"")+
      (c?`<img src="${IMG[c.id]}" alt=""><span class="cap">${c.cap}</span>`:`<span class="empty">${i+1}번째<br>그림</span>`);
    b.setAttribute("aria-label",(i+1)+"번 칸"+(c?": "+c.cap:" (비어 있음)"));
    b.onclick=()=>{ if(!c)return; placed[i]=null; resEl.textContent=""; renderOrder(); };
    slotsEl.appendChild(b);
  });
  poolEl.innerHTML="";
  cards.forEach(c=>{
    const b=document.createElement("button"); b.type="button"; b.className="card"+(placed.includes(c.id)?" used":"");
    b.innerHTML=`<img src="${IMG[c.id]}" alt=""><p class="bracket">&lt;&nbsp;&nbsp;&nbsp;&nbsp;&gt;</p><p class="cap">${c.cap}</p>`;
    b.onclick=()=>{ const k=placed.indexOf(null); if(k<0)return; placed[k]=c.id; resEl.textContent=""; renderOrder(); };
    poolEl.appendChild(b);
  });
}
document.getElementById("check").onclick=()=>{
  if(placed.includes(null)){ resEl.textContent="그림 5장을 모두 칸에 넣어 주세요."; renderOrder(); return; }
  const right=placed.filter((cid,i)=>cards.find(x=>x.id===cid).n===i+1).length;
  resEl.textContent = right===5 ? "참 잘했어요! 요셉 이야기를 순서대로 완성했어요." : `${right}개 맞았어요. ✕ 표시된 그림을 눌러 빼고 다시 해 봐요.`;
  renderOrder(true);
};
document.getElementById("reset").onclick=()=>{ placed.fill(null); resEl.textContent=""; renderOrder(); };
renderOrder();

/* ---------- quiz ---------- */
const quiz = [
  {q:"감옥에 갇힌 요셉은 사람들에게 무엇을 해 주었나요?", o:["꿈이 무슨 뜻인지 풀이해 주었어요","맛있는 빵을 만들어 주었어요","노래를 불러 주었어요","감옥 문을 열어 주었어요"], a:0, e:"요셉은 사람들이 꾼 꿈의 뜻을 알려 주었고, 파라오 왕의 꿈까지 풀이해 주었어요.", t:"0:25"},
  {q:"파라오의 꿈은 이집트에 어떤 일이 생긴다는 뜻이었나요?", o:["7년 동안 비가 계속 온다","7년 풍년 뒤에 7년 흉년이 온다","소들이 모두 사라진다","큰 전쟁이 일어난다"], a:1, e:"7년 동안 음식이 넉넉하고, 그 뒤 7년 동안 기근(흉년)이 온다는 뜻이었어요. 그래서 요셉은 곡식을 미리 모아 두었어요.", t:"0:35"},
  {q:"아버지 이스라엘(야곱)이 처음에 이집트로 보내지 않은 막내아들은 누구예요?", o:["르우벤","유다","벤자민(벤야민)","요셉"], a:2, e:"아버지는 막내 벤자민이 다칠까 봐 걱정해서 처음에는 보내지 않았어요.", t:"1:20"},
  {q:"요셉이 하인에게 벤자민의 가방에 몰래 숨기라고 한 것은 무엇인가요?", o:["금화","곡식 한 자루","왕관","은잔(컵)"], a:3, e:"요셉은 자기 은잔을 벤자민의 가방에 숨기게 해서 형들을 한 번 더 시험했어요.", t:"2:32"},
  {q:"형들이 잘못을 빌었을 때, 요셉은 어떻게 했나요?", o:["형들을 다시 감옥에 가두었어요","모르는 척하고 돌려보냈어요","자기가 요셉이라고 밝히고 형들을 용서했어요","화가 나서 울기만 했어요"], a:2, e:"요셉은 자기가 누구인지 밝히고 형들을 용서했어요. 하느님께서 이 모든 일을 좋게 이끄셔서 많은 사람의 생명을 구했어요.", t:"2:57"}
];
const quizEl=document.getElementById("quiz");
let qi=0, picks=Array(quiz.length).fill(null);
const KEYS=["가","나","다","라"];
function renderQuiz(){
  if(qi>=quiz.length){
    const sc=picks.filter((p,i)=>p===quiz[i].a).length;
    quizEl.innerHTML=`<div class="score"><p class="qnum" style="display:inline-block">결과</p><p class="big">${quiz.length}문제 중 ${sc}개!</p><p>${sc===quiz.length?"모두 맞혔어요! 요셉 이야기 박사님이에요.":"잘했어요! 틀린 문제는 동영상을 다시 보며 확인해 봐요."}</p><button class="btn primary" id="again" type="button">다시 풀기</button></div>`;
    document.getElementById("again").onclick=()=>{qi=0;picks.fill(null);renderQuiz();};
    return;
  }
  const Q=quiz[qi], p=picks[qi];
  quizEl.innerHTML=`<div class="qhead"><span class="qnum">${qi+1} / ${quiz.length}</span><span class="qtime">동영상 ${Q.t} 무렵</span></div>
    <p class="qtext">${Q.q}</p>
    <div class="opts">${Q.o.map((o,k)=>`<button type="button" class="opt ${p!==null?(k===Q.a?"right":(k===p?"wrong":"")):""}" data-k="${k}" ${p!==null?"disabled":""}><span class="k">${KEYS[k]}</span><span>${o}</span></button>`).join("")}</div>
    ${p!==null?`<div class="explain"><b>${p===Q.a?"정답이에요!":"아쉬워요. 정답은 "+KEYS[Q.a]+"번이에요."}</b> ${Q.e}</div>`:""}
    <div class="qnav"><button class="btn" id="qprev" type="button" ${qi===0?"disabled":""}>◀ 이전 문제</button>
    <button class="btn primary" id="qnext" type="button" ${p===null?"disabled":""}>${qi===quiz.length-1?"결과 보기":"다음 문제 ▶"}</button></div>`;
  quizEl.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{picks[qi]=+b.dataset.k;renderQuiz();});
  document.getElementById("qprev").onclick=()=>{qi--;renderQuiz();};
  document.getElementById("qnext").onclick=()=>{qi++;renderQuiz();};
}
renderQuiz();
document.getElementById("answers").innerHTML=quiz.map(Q=>`<li>${Q.q} → <b>${KEYS[Q.a]}. ${Q.o[Q.a]}</b> (동영상 ${Q.t})</li>`).join("");
</script>
